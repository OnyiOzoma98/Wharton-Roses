<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>You've got flowers 🌹</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#07060a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;overflow:hidden}

/* ── SCREENS ── */
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;overflow-y:auto;overflow-x:hidden;opacity:0;pointer-events:none;transition:opacity 0.5s ease}
.screen.active{opacity:1;pointer-events:all}
.screen.leaving{opacity:0}

/* ── SCREEN 1: CHOOSER ── */
#screen-chooser{
  background:
    radial-gradient(ellipse 80% 60% at 20% 90%, rgba(120,0,20,0.12) 0%, transparent 60%),
    radial-gradient(ellipse 60% 50% at 85% 15%, rgba(80,0,30,0.1) 0%, transparent 55%),
    #07060a;
  padding-bottom:20px;
}

/* Top selection bar */
.selection-bar{
  position:sticky;top:0;z-index:100;width:100%;
  background:rgba(7,6,10,0.9);backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(255,255,255,0.04);
  padding:20px 20px 16px;
}
.selection-inner{max-width:700px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px}
.selection-left{display:flex;flex-direction:column;gap:4px}
.selection-eyebrow{font-size:0.65rem;letter-spacing:5px;text-transform:uppercase;color:#333}
.selection-status{font-size:1.05rem;color:#555;transition:color 0.3s}
.selection-status.chosen{color:#fff}
.selection-status strong{color:#e8c96d}
.selection-thumb{width:36px;height:36px;border-radius:50%;overflow:hidden;border:1.5px solid rgba(232,201,109,0.4);flex-shrink:0;display:none}
.selection-thumb.visible{display:block}
.selection-thumb img{width:100%;height:100%;object-fit:cover;object-position:top}
.selection-thumb .thumb-fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:0.75rem;font-weight:700;color:#e8c96d}
.continue-btn{padding:11px 22px;background:#e8c96d;border:none;border-radius:99px;color:#000;font-size:0.8rem;font-weight:700;letter-spacing:0.5px;cursor:pointer;font-family:inherit;white-space:nowrap;transition:all 0.25s;flex-shrink:0;opacity:0.35;pointer-events:none}
.continue-btn.ready{opacity:1;pointer-events:all}
.continue-btn.ready:hover{background:#f5db7a;transform:scale(1.03)}

/* Search */
.search-wrap{width:100%;max-width:700px;padding:20px 20px 12px;margin:0 auto;position:relative}
.search-input{width:100%;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);border-radius:14px;padding:12px 16px 12px 44px;color:#fff;font-size:0.9rem;font-family:inherit;outline:none;transition:border-color 0.3s,background 0.3s}
.search-input:focus{border-color:rgba(255,255,255,0.12);background:rgba(255,255,255,0.06)}
.search-input::placeholder{color:#2a2a35}
.s-icon{position:absolute;left:32px;top:50%;transform:translateY(-50%);color:#2a2a35;font-size:0.9rem;pointer-events:none}

/* Grid */
.celeb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;padding:4px 20px 20px;width:100%;max-width:700px;margin:0 auto}

/* Regular card */
.celeb-card{border-radius:14px;overflow:hidden;cursor:pointer;position:relative;aspect-ratio:3/4;transition:transform 0.25s,box-shadow 0.25s;background:#0e0c14;border:1px solid rgba(255,255,255,0.04)}
.celeb-card:hover{transform:translateY(-4px);box-shadow:0 12px 30px rgba(0,0,0,0.6)}
.celeb-card.selected{box-shadow:0 0 0 2px #e8c96d,0 12px 40px rgba(232,201,109,0.12)}
.card-img-wrap{width:100%;height:100%;position:relative}
.card-img-wrap img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block;transition:transform 0.3s}
.celeb-card:hover .card-img-wrap img{transform:scale(1.06)}
.card-fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:1.6rem;font-weight:800;color:rgba(232,201,109,0.5);background:linear-gradient(160deg,#100e1a,#0c0a14);letter-spacing:1px;position:absolute;inset:0}
.card-overlay{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(to top,rgba(0,0,0,0.92) 0%,rgba(0,0,0,0.45) 55%,transparent 100%);padding:26px 10px 10px}
.card-name{font-size:0.75rem;font-weight:600;color:#fff;line-height:1.2}
.card-check{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;background:#e8c96d;display:flex;align-items:center;justify-content:center;font-size:0.65rem;color:#000;font-weight:800;opacity:0;transform:scale(0.4);transition:all 0.2s}
.celeb-card.selected .card-check{opacity:1;transform:scale(1)}

/* Special cards */
.special-card{border-radius:14px;cursor:pointer;position:relative;aspect-ratio:3/4;transition:transform 0.25s,box-shadow 0.25s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.special-card:hover{transform:translateY(-4px)}
.special-card.mystery{background:linear-gradient(160deg,#100e1a,#180e22);border:1px solid rgba(160,100,255,0.15)}
.special-card.mystery:hover{box-shadow:0 12px 30px rgba(140,80,255,0.1)}
.special-card.randomize{background:linear-gradient(160deg,#0c1018,#081422);border:1px solid rgba(80,180,200,0.15)}
.special-card.randomize:hover{box-shadow:0 12px 30px rgba(60,160,200,0.1)}
.special-card.selected{box-shadow:0 0 0 2px #e8c96d}
.sp-icon{font-size:2.4rem;display:inline-block}
.sp-label{font-size:0.72rem;color:#555;text-align:center;padding:0 10px;line-height:1.3}
.sp-check{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.65rem;font-weight:800;color:#000;opacity:0;transform:scale(0.4);transition:all 0.2s}
.special-card.selected .sp-check{opacity:1;transform:scale(1)}
@keyframes mystery-pulse{0%,100%{filter:drop-shadow(0 0 5px rgba(160,100,255,0.3))}50%{filter:drop-shadow(0 0 16px rgba(160,100,255,0.75))}}
@keyframes spin-dice{to{transform:rotate(360deg)}}
.no-results{display:none;color:#2a2a35;font-size:0.82rem;padding:40px;text-align:center;grid-column:1/-1}

/* ── SCENE BG (shared) ── */
.scene-bg{position:fixed;inset:0;background-size:cover;background-position:center top;filter:blur(24px) brightness(0.17) saturate(1.5);transform:scale(1.12);z-index:-1}

/* ── SCREEN 2: DELIVERY ── */
#screen-delivery{justify-content:center;padding:40px 24px}
.delivery-inner{display:flex;flex-direction:column;align-items:center;gap:22px;max-width:380px;width:100%}

/* Celebrity halo */
.celeb-halo{width:108px;height:108px;border-radius:50%;overflow:hidden;border:2px solid rgba(232,201,109,0.3);box-shadow:0 0 0 6px rgba(232,201,109,0.05),0 0 50px rgba(232,201,109,0.08);animation:halo-pop 0.9s cubic-bezier(0.34,1.4,0.64,1) both}
@keyframes halo-pop{from{opacity:0;transform:scale(0.7)}to{opacity:1;transform:scale(1)}}
.celeb-halo img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
.celeb-halo .halo-fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:2.6rem;background:linear-gradient(135deg,#1a1028,#0e0818)}
.delivery-tag{font-size:0.68rem;color:rgba(232,201,109,0.5);letter-spacing:4px;text-transform:uppercase;text-align:center;animation:fade-up 0.5s 0.4s ease both}

/* Real Bouquet Photo */
.bouquet{animation:bouquet-rise 1s 0.7s cubic-bezier(0.34,1.1,0.64,1) both}
@keyframes bouquet-rise{from{opacity:0;transform:translateY(36px) scale(0.9)}to{opacity:1;transform:translateY(0) scale(1)}}
.bouquet-photo{width:210px;height:210px;object-fit:cover;object-position:center top;border-radius:50%;border:2px solid rgba(232,201,109,0.18);box-shadow:0 8px 50px rgba(0,0,0,0.65),0 0 0 6px rgba(232,201,109,0.04);display:block}
.bouquet-photo-fallback{width:210px;height:210px;border-radius:50%;background:linear-gradient(160deg,#2a0008,#1a0010);border:2px solid rgba(200,40,70,0.3);display:flex;align-items:center;justify-content:center;font-size:3.5rem;box-shadow:0 8px 40px rgba(0,0,0,0.6);display:none}

.delivery-msg{font-size:0.94rem;color:rgba(255,255,255,0.68);text-align:center;line-height:1.8;font-style:italic;animation:fade-up 0.6s 1.3s ease both}
.receive-btn{padding:14px 36px;background:transparent;border:1px solid rgba(232,201,109,0.35);border-radius:99px;color:#e8c96d;font-size:0.88rem;cursor:pointer;font-family:inherit;letter-spacing:1px;transition:all 0.3s;animation:fade-up 0.5s 2s ease both}
.receive-btn:hover{background:rgba(232,201,109,0.07);border-color:#e8c96d;transform:scale(1.02)}
@keyframes fade-up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

/* ── SCREEN 3: NOTE ── */
#screen-note{justify-content:flex-start;padding:48px 24px 40px}
.note-inner{display:flex;flex-direction:column;align-items:center;width:100%;max-width:360px;margin:0 auto}
.note-progress{align-self:flex-start;font-size:0.65rem;letter-spacing:5px;text-transform:uppercase;color:#2e2e3a;margin-bottom:32px;transition:color 0.3s}
.note-progress.prominent{color:rgba(255,255,255,0.45)}

/* Rose photo */
.rose-photo-wrap{width:80px;height:80px;border-radius:50%;overflow:hidden;border:1.5px solid rgba(200,20,40,0.3);box-shadow:0 0 20px rgba(180,10,30,0.15);transform:scale(0);opacity:0;transition:transform 0.7s cubic-bezier(0.34,1.56,0.64,1),opacity 0.4s ease}
.rose-photo-wrap.bloomed{transform:scale(1);opacity:1}
.rose-photo-wrap img{width:100%;height:100%;object-fit:cover;object-position:center}
.rose-photo-wrap .rose-fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:2.6rem;background:#1a0a10}

.rose-stem{width:3px;height:54px;background:linear-gradient(to bottom,#2d7a2d,#1a5a1a);border-radius:2px;margin:0 auto}

.ribbon-zone{position:relative;display:flex;justify-content:center;align-items:center;height:16px;margin:-2px 0}
.ribbon-line{width:68px;height:2.5px;background:linear-gradient(to right,#9b0020,#c41e3a,#9b0020);border-radius:2px;transition:opacity 0.5s ease,transform 0.6s ease}
.ribbon-line.untied{opacity:0;transform:scaleX(2.5)}

.note-scroll{background:linear-gradient(148deg,#f7f1e0 0%,#ede5c2 40%,#f2ead0 100%);border-radius:5px;max-height:0;opacity:0;transform:scaleY(0);transform-origin:top;transition:max-height 0.95s ease,opacity 0.4s ease,transform 0.95s cubic-bezier(0.34,1.05,0.64,1);box-shadow:0 12px 40px rgba(0,0,0,0.5),inset 0 1px 0 rgba(255,255,255,0.5);margin-top:12px;width:100%;padding:0 22px}
.note-scroll.open{max-height:460px;opacity:1;transform:scaleY(1);padding:24px 22px}
.note-body{font-size:0.91rem;color:#281c08;line-height:1.78;font-style:italic;min-height:40px}
.note-cursor{display:inline-block;width:2px;height:0.88em;background:#7a580a;vertical-align:middle;animation:blink 0.8s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.note-sig{margin-top:16px;padding-top:12px;border-top:1px solid rgba(120,88,20,0.18);font-size:0.78rem;color:#7a580a;font-style:normal;opacity:0;transition:opacity 0.5s ease}
.note-sig.show{opacity:1}
.note-sig strong{font-weight:700}
.note-actions{margin-top:26px;display:flex;gap:10px;width:100%}
.note-btn{flex:1;padding:13px 16px;background:rgba(232,201,109,0.05);border:1px solid rgba(232,201,109,0.22);border-radius:99px;color:#e8c96d;font-size:0.8rem;cursor:pointer;font-family:inherit;letter-spacing:0.5px;transition:all 0.3s}
.note-btn:hover{background:rgba(232,201,109,0.12);border-color:rgba(232,201,109,0.55)}
.note-btn.secondary{background:transparent;border-color:#1c1c24;color:#3a3a50;font-size:0.76rem}
.note-btn.secondary:hover{border-color:#2a2a38;color:#555}

/* ── SCREEN 4: ALL NOTES ── */
#screen-allnotes{justify-content:flex-start;padding:52px 20px 80px;background:#07060a}
.allnotes-wrap{width:100%;max-width:500px;margin:0 auto}
.allnotes-eyebrow{font-size:0.65rem;letter-spacing:5px;text-transform:uppercase;color:#2a2a35;margin-bottom:28px}
.note-item{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.04);border-radius:14px;padding:20px;margin-bottom:10px}
.note-item-msg{font-size:0.87rem;color:rgba(255,255,255,0.75);line-height:1.72;font-style:italic}
.note-item-sig{margin-top:12px;font-size:0.73rem;color:#333;letter-spacing:0.5px}
.note-item-sig span{color:rgba(232,201,109,0.6);font-weight:600}
.allnotes-finish{width:100%;margin-top:22px;padding:14px;background:transparent;border:1px solid #161620;border-radius:14px;color:#333;font-size:0.78rem;cursor:pointer;font-family:inherit;letter-spacing:2px;transition:all 0.3s}
.allnotes-finish:hover{border-color:#242430;color:#555}

/* ── SCREEN 5: OUTRO ── */
#screen-outro{justify-content:center;padding:40px 24px}
.outro-inner{display:flex;flex-direction:column;align-items:center;gap:28px;max-width:380px;width:100%;position:relative;z-index:1}
.outro-halo{width:100px;height:100px;border-radius:50%;overflow:hidden;border:2px solid rgba(232,201,109,0.2);box-shadow:0 0 40px rgba(232,201,109,0.08)}
.outro-halo img{width:100%;height:100%;object-fit:cover;object-position:top}
.outro-halo .outro-fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:2.6rem;background:linear-gradient(135deg,#1a1028,#0e0818)}
.speech-bubble{background:rgba(255,255,255,0.038);border:1px solid rgba(255,255,255,0.07);border-radius:20px 20px 20px 4px;padding:24px;font-size:0.94rem;color:rgba(255,255,255,0.8);line-height:1.78;max-width:340px;opacity:0;transform:translateY(14px);animation:bubble-in 0.75s 0.5s ease forwards;backdrop-filter:blur(10px)}
@keyframes bubble-in{to{opacity:1;transform:translateY(0)}}
.speech-bubble em{color:#e8c96d;font-style:normal;font-weight:600}
.rose-request{margin-top:4px;width:100%;max-width:340px;opacity:0;animation:bubble-in 0.6s 1.4s ease forwards}
.rose-request-btn{width:100%;display:flex;align-items:center;gap:12px;padding:14px 18px;background:rgba(200,40,70,0.06);border:1px solid rgba(200,40,70,0.22);border-radius:99px;color:rgba(255,170,185,0.78);font-size:0.79rem;cursor:pointer;font-family:inherit;text-align:left;transition:all 0.3s;line-height:1.45}
.rose-request-btn:hover{background:rgba(200,40,70,0.13);border-color:rgba(200,40,70,0.5);color:rgba(255,200,210,1)}
.ricon{font-size:1.25rem;flex-shrink:0}
.falling-petal{position:fixed;pointer-events:none;z-index:0;opacity:0;animation:petal-fall linear infinite}
@keyframes petal-fall{0%{opacity:0;transform:translateY(-10px) rotate(0)}10%{opacity:0.55}90%{opacity:0.2}100%{opacity:0;transform:translateY(110vh) rotate(540deg)}}
</style>
</head>
<body>

<!-- ── SCREEN 1: CHOOSER ── -->
<div id="screen-chooser" class="screen active">
  <div class="selection-bar">
    <div class="selection-inner">
      <div style="display:flex;align-items:center;gap:12px">
        <div class="selection-thumb" id="sel-thumb">
          <img id="sel-thumb-img" alt="" referrerpolicy="no-referrer">
          <div class="thumb-fallback" id="sel-thumb-fb"></div>
        </div>
        <div class="selection-left">
          <div class="selection-eyebrow">You've got flowers</div>
          <div class="selection-status" id="sel-status">Pick who's delivering them</div>
        </div>
      </div>
      <button class="continue-btn" id="continue-btn" onclick="goToDelivery()">Continue →</button>
    </div>
  </div>
  <div class="search-wrap">
    <span class="s-icon">🔍</span>
    <input class="search-input" id="search-input" type="text" placeholder="Search by name..." autocomplete="off" oninput="filterCelebs()">
  </div>
  <div class="celeb-grid" id="celeb-grid"></div>
  <div class="no-results" id="no-results">No match found</div>
</div>

<!-- ── SCREEN 2: DELIVERY ── -->
<div id="screen-delivery" class="screen">
  <div class="scene-bg" id="delivery-bg"></div>
  <div class="delivery-inner">
    <div class="celeb-halo" id="delivery-halo"></div>
    <div class="delivery-tag" id="delivery-tag"></div>
    <div class="bouquet">
      <img class="bouquet-photo" src="img/bouquet.jpg" alt="bouquet"
           onerror="this.style.display='none';this.nextSibling.style.display='flex'">
      <div class="bouquet-photo-fallback">🌹</div>
    </div>
    <div class="delivery-msg" id="delivery-msg"></div>
    <button class="receive-btn" onclick="startNotes()">Receive my flowers →</button>
  </div>
</div>

<!-- ── SCREEN 3: NOTE ── -->
<div id="screen-note" class="screen">
  <div class="scene-bg" id="note-bg"></div>
  <div class="note-inner">
    <div class="note-progress" id="note-progress">Note 1 of 1</div>
    <div class="rose-photo-wrap" id="rose-wrap">
      <img src="img/rose.jpg" alt="rose" onerror="this.style.display='none';this.nextSibling.style.display='flex'">
      <div class="rose-fallback" style="display:none">🌹</div>
    </div>
    <div class="rose-stem"></div>
    <div class="ribbon-zone">
      <div class="ribbon-line" id="ribbon-line"></div>
    </div>
    <div class="note-scroll" id="note-scroll">
      <div class="note-body" id="note-body"></div>
      <div class="note-sig" id="note-sig">— <strong id="note-sig-name"></strong></div>
    </div>
    <div class="note-actions" id="note-actions"></div>
  </div>
</div>

<!-- ── SCREEN 4: ALL NOTES ── -->
<div id="screen-allnotes" class="screen">
  <div class="allnotes-wrap">
    <div class="allnotes-eyebrow">All your notes</div>
    <div id="all-notes-list"></div>
    <button class="allnotes-finish" onclick="goToOutro()">Done →</button>
  </div>
</div>

<!-- ── SCREEN 5: OUTRO ── -->
<div id="screen-outro" class="screen">
  <div class="scene-bg" id="outro-bg"></div>
  <div class="falling-petal" style="left:8%;animation-duration:6.5s;animation-delay:0.5s;font-size:1rem">🌸</div>
  <div class="falling-petal" style="left:23%;animation-duration:8s;animation-delay:1.6s;font-size:0.85rem">🌸</div>
  <div class="falling-petal" style="left:50%;animation-duration:7s;animation-delay:0.9s;font-size:0.7rem">🌸</div>
  <div class="falling-petal" style="left:71%;animation-duration:9s;animation-delay:2.2s">🌸</div>
  <div class="falling-petal" style="left:88%;animation-duration:6s;animation-delay:1.8s;font-size:0.9rem">🌸</div>
  <div class="outro-inner">
    <div class="outro-halo" id="outro-halo"></div>
    <div class="speech-bubble">Thank you for carrying yourself forward and leaning into the <em>Black Wharton class of 2026</em>. Here's to a lifetime of connection to follow. 🌹</div>
    <div class="rose-request" id="rose-request" style="opacity:0;animation:bubble-in 0.6s 1.4s ease forwards">
      <button class="rose-request-btn" id="rose-btn">
        <span class="ricon">🌹</span>
        <span>Would you still like me to get you some roses for these when I see you? I'll be sure to remember.</span>
      </button>
    </div>
  </div>
</div>

<script>
const CELEBRITIES = [{"slug": "barack_obama", "name": "Barack Obama", "img": "img/barack-obama.jpg"}, {"slug": "jay-z", "name": "Jay-Z", "img": "img/jay-z.jpg"}, {"slug": "michael_jackson", "name": "Michael Jackson", "img": "img/michael-jackson.jpg"}, {"slug": "whitney_houston", "name": "Whitney Houston", "img": "img/whitney-houston.jpg"}, {"slug": "davido", "name": "Davido", "img": "img/davido.jpg"}, {"slug": "rema_(musician)", "name": "Rema", "img": "img/rema.jpg"}, {"slug": "tems", "name": "Tems", "img": "img/tems.jpg"}, {"slug": "dave_(rapper)", "name": "Dave", "img": "img/dave.jpg"}, {"slug": "bob_marley", "name": "Bob Marley", "img": "img/bob-marley.jpg"}, {"slug": "rihanna", "name": "Rihanna", "img": "img/rihanna.jpg"}, {"slug": "drake_(musician)", "name": "Drake", "img": "img/drake.jpg"}, {"slug": "michael_jordan", "name": "Michael Jordan", "img": "img/michael-jordan.jpg"}, {"slug": "eddie_murphy", "name": "Eddie Murphy", "img": "img/eddie-murphy.jpg"}, {"slug": "adele", "name": "Adele", "img": "img/adele.jpg"}, {"slug": "serena_williams", "name": "Serena Williams", "img": "img/serena-williams.jpg"}, {"slug": "simone_biles", "name": "Simone Biles", "img": "img/simone-biles.jpg"}, {"slug": "sza", "name": "SZA", "img": "img/sza.jpg"}, {"slug": "kaytranada", "name": "Kaytranada", "img": "img/kaytranada.jpg"}, {"slug": "eminem", "name": "Eminem", "img": "img/eminem.jpg"}, {"slug": "zendaya", "name": "Zendaya", "img": "img/zendaya.jpg"}, {"slug": "denzel_washington", "name": "Denzel Washington", "img": "img/denzel-washington.jpg"}, {"slug": "dave_chappelle", "name": "Dave Chappelle", "img": "img/dave-chappelle.jpg"}, {"slug": "lebron_james", "name": "LeBron James", "img": "img/lebron-james.jpg"}, {"slug": "stephen_curry", "name": "Stephen Curry", "img": "img/stephen-curry.jpg"}, {"slug": "lupita_nyong%27o", "name": "Lupita Nyong'o", "img": "img/lupita-nyong-o.jpg"}, {"slug": "tiwa_savage", "name": "Tiwa Savage", "img": "img/tiwa-savage.jpg"}, {"slug": "wizkid", "name": "Wizkid", "img": "img/wizkid.jpg"}, {"slug": "beyonc%C3%A9", "name": "Beyoncé", "img": "img/beyonce.jpg"}, {"slug": "michelle_obama", "name": "Michelle Obama", "img": "img/michelle-obama.jpg"}, {"slug": "asake", "name": "Asake", "img": "img/asake.jpg"}, {"slug": "kendrick_lamar", "name": "Kendrick Lamar", "img": "img/kendrick-lamar.jpg"}, {"slug": "j._cole", "name": "J Cole", "img": "img/j-cole.jpg"}, {"slug": "kanye_west", "name": "Kanye West", "img": "img/kanye-west.jpg"}, {"slug": "jalen_hurts", "name": "Jalen Hurts", "img": "img/jalen-hurts.jpg"}, {"slug": "steve_harvey", "name": "Steve Harvey", "img": "img/steve-harvey.jpg"}, {"slug": "kamala_harris", "name": "Kamala Harris", "img": "img/kamala-harris.jpg"}, {"slug": "viola_davis", "name": "Viola Davis", "img": "img/viola-davis.jpg"}, {"slug": "sydney_mclaughlin", "name": "Sydney McLaughlin-Levrone", "img": "img/sydney-mclaughlin-levrone.jpg"}, {"slug": "Michael Jordan (actor)", "name": "Michael B Jordan", "img": "img/michael-b-jordan.jpg"}, {"slug": "Ayra_Starr", "name": "Ayra Starr", "img": "img/ayra-starr.jpg"}, {"slug": "David_M._Solomon", "name": "David Solomon", "img": "img/david-solomon.jpg"}, {"slug": "Teyana_Taylor", "name": "Teyana Taylor", "img": "img/teyana-taylor.jpg"}, {"slug": "Jamie_Dimon", "name": "Jamie Dimon", "img": "img/jamie-dimon.jpg"}, {"slug": "Venus_Williams", "name": "Venus Williams", "img": "img/venus-williams.jpg"}, {"slug": "Issa_Rae", "name": "Issa Rae", "img": "img/issa-rae.jpg"}, {"slug": "A%27ja_Wilson", "name": "A'ja Wilson", "img": "img/a-ja-wilson.jpg"}, {"slug": "Megan_Thee_Stallion", "name": "Megan Thee Stallion", "img": "img/megan-thee-stallion.jpg"}, {"slug": "Anderson_.Paak", "name": "Anderson .Paak", "img": "img/anderson-paak.jpg"}, {"slug": "Angela_Bassett", "name": "Angela Bassett", "img": "img/angela-bassett.jpg"}, {"slug": "Sterling_K._Brown", "name": "Sterling K Brown", "img": "img/sterling-k-brown.jpg"}, {"slug": "Taraji_P._Henson", "name": "Taraji P Henson", "img": "img/taraji-p-henson.jpg"}, {"slug": "Mellody_Hobson", "name": "Mellody Hobson", "img": "img/mellody-hobson.jpg"}, {"slug": "Keke_Palmer", "name": "Keke Palmer", "img": "img/keke-palmer.jpg"}, {"slug": "Shonda_Rhimes", "name": "Shonda Rhimes", "img": "img/shonda-rhimes.jpg"}, {"slug": "Chimamanda_Ngozi_Adichie", "name": "Chimamanda Ngozi Adichie", "img": "img/chimamanda-ngozi-adichie.jpg"}, {"slug": "Coco_Gauff", "name": "Coco Gauff", "img": "img/coco-gauff.jpg"}, {"slug": "Halle_Bailey", "name": "Halle Bailey", "img": "img/halle-bailey.jpg"}, {"slug": "Kevin_Fredericks", "name": "Kev on Stage", "img": "img/kev-on-stage.jpg"}, {"slug": "Chloe_x_Halle", "name": "Chloe Bailey", "img": "img/chloe-bailey.jpg"}];
const RECIPIENTS  = {"nia-coleman": {"name": "Nia", "fullName": "Nia Coleman", "notes": [{"message": "Thank you for showing us what grace under pressure looks like", "sender": "Anonymous"}, {"message": "Nia!!! You have a really incredible talent for bringing people in and doing so in a fun way. You’re also so disciplined with the gym but I also appreciate that you show your love for food because it shows balance and is encouraging. You’re a very diligent person too - with pricing, with being a huge part of a great Black 101, and with casing!", "sender": "Onyi"}]}, "kenya-wright": {"name": "Kenya", "fullName": "Kenya Wright", "notes": [{"message": "Thank you for showing us what grace under pressure looks like", "sender": "Anonymous"}, {"message": "Kenya aka my partner in FAAMBALY! I've so enjoyed going through this MBA experience with you. I appreciate how you've always shown up as your authentic self and are someone who has moved through this program with intention. I'm grateful for the memories we've shared, from our 1-900 runs to great times in Japan. You're going to be such a blessing to your community in NY and I can't wait to watch your story continue to unfold. I'll be rooting for you!", "sender": "Nati"}]}, "allison-holmes": {"name": "Allison", "fullName": "Allison Holmes", "notes": [{"message": "The epitome of grace and class, thank you for all that you do!", "sender": "Anonymous"}, {"message": "You earned that class act award! You’re constantly someone who I tell others deserves so much good! May God bless you abundantly and exceed your expectations. You perpetuate good and operate in integrity and it radiates from you", "sender": "Onyi"}]}, "alexis-jones": {"name": "Alexis", "fullName": "Alexis Jones", "notes": [{"message": "The epitome of grace and class, thank you for all that you do!", "sender": "Anonymous"}, {"message": "Alexis! Truly had a time hanging with you this year. Whoever says you're not jokes is a liar", "sender": "Tolu"}, {"message": "Its been great to get to know you over the past year and a half - when we hang out it is always filled with laughter and leads to good memories and I'm looking forward to making more post-MBA", "sender": "Ben"}]}, "ola-bola": {"name": "Ola", "fullName": "Ola Bola", "notes": [{"message": "The funnest person I know, thank you for enjoying life unapologetically and inspiring others to do the same!", "sender": "Anonymous"}]}, "eyram-adedze": {"name": "Eyram", "fullName": "Eyram Adedze", "notes": [{"message": "Such a pure-hearted soul. Really lovely getting to know you and I wish you all the very, very best post-MBA! I know those job offers will come in eventually, don’t stress!", "sender": "Anonymous"}, {"message": "You’re easily one of the top 3 sweetest people at Wharton. Your love, kindness and generosity are remarkable. So happy to have met you!", "sender": "Abigael"}, {"message": "you're such a star and am sooo glad Wharton brought us together!", "sender": "Lyncy"}, {"message": "Eyram, I've really enjoyed getting to know you over the past 2 years. You have such a warm and kind spirit that puts people at ease. From WASA to WCF, we've shared great memories. You're full of joy and I pray you continue to radiate that joy to all around you. I look forward to staying connected and can't wait to see all you do!", "sender": "Nati"}, {"message": "You are a bubble of great energy and I truly enjoy having you around and having you as a friend!", "sender": "Anonymous"}, {"message": "Eyram!!! You are such a special person with such an amazing heart. You bring warmth and kindness into every interaction and your smile lights up rooms. Thank you so much for all that you did with WABF, you were the rock for alumni engagement.", "sender": "Onyi"}]}, "tome-buluku": {"name": "Tome", "fullName": "Tome Buluku", "notes": [{"message": "You’re genuinely an inspiration to me man. The way you carry yourself, treat others, and move with integrity challenges me to be a better man. Looking forward to the day we can potentially do some work together in future on the continent!", "sender": "Kofi Agyare-Kwabi"}, {"message": "Tome, my brother I'm grateful to have met you! I appreciate the wisdom and intention with which you move and the deep intellect that you've been blessed with. I'm grateful to call you a brother in Christ and can't wait to see what you do next bro!", "sender": "Nati"}, {"message": "You make me think of Solomon’s prayer. You are a wise man and listening to you speak has repeatedly taught me about new ways to view the world and situations. Your principled faith also inspires me in ways that I can grow", "sender": "Onyi"}]}, "onyi-ozoma": {"name": "Onyi", "fullName": "Onyi Ozoma", "notes": [{"message": "Genuinely one of the brightest stars I’ve ever seen. I feel like you light up every room you’re in with your authenticity and transparency. Keep being yourself, not much more to add here. The fact you came up with this and are executing it for 2 years straight alone says a lot — not to think of the countless ways you must be supporting others that go unseen to many of us. Appreciate you, brother.", "sender": "Kofi Agyare-Kwabi"}, {"message": "Onyi, you’re a breath of fresh air and such a genuinely kind person. You bring inclusivity, calm, and a voice of reason wherever you go, always open-minded and drama-free. Keep being your authentic self.", "sender": "Kola A"}, {"message": "Thank you for literally always helping me with any and everything that I need help with and being there for me! It’s been great getting closer to you this year. You’re very kind, gentle, and wise beyond your years. We need more men like that in the world.", "sender": "Amanda Agyapong"}, {"message": "Onyiiiiii! You're such an amazing person inside and out. You have a special place in my heart and I pray God will continue to bless you for all that you do for everyone around you. Wharton 26 would not be complete without you! Thanks for doing this!", "sender": "NK"}, {"message": "Onyi! Thank you for making this community better in countless ways, from your kindness to your thoughtful questions and your curiosity. I genuinely appreciate the way that you show up in all spaces, and I hope that never changes.", "sender": "Gaelle"}, {"message": "Onyi! You always hold it down. Truly appreciate getting to share this Wharton experience with you and all you do for the community", "sender": "Tolu"}, {"message": "I love how you have continued to get our class together and connect people with various social events. These are the moments we will remember! Keep being a go-getter! Excited to see what you will accomplish post-school!", "sender": "Anonymous"}, {"message": "You are truly a great person who is both extremely fun to hang out with and incredibly thoughtful - I'm looking forward to continuing to grow our friendship", "sender": "Ben"}]}, "erika-chapman": {"name": "Erika", "fullName": "Erika Chapman", "notes": [{"message": "You are such a dependable and loyal. You are so great with people and make everyone feel welcomed. I hope you know how much we value you and enjoy your company.", "sender": "Haniel Ogburu-Ogbonnaya"}, {"message": "You are such a kind, honest, and thoughtful person. You are very generous and exude signs of being a good person that wants good. There’s a level of purity about your aura and I am always rooting for you. Thank you for covering our lunch too!", "sender": "Onyi"}]}, "kofi-agyare-kwabi": {"name": "Kofi", "fullName": "Kofi Agyare-Kwabi", "notes": [{"message": "You are so easy to talk to and make people feel seen. I am seriously going to miss our chats and your calm presence once we complete this journey. Talking with you has given me peace and I hope I’ve provided that space for you too.", "sender": "Haniel Ogburu-Ogbonnaya"}, {"message": "Kofi my man, you're someone I wish I was able to spend more time with during the MBA. Our interactions have always been refreshing and I find you to be someone who is thoughtful and intentional in all you do. You have a quiet confidence that I admire and are assured in the path and direction you're leaning into. One memory I have was how you handled the situation in Doha - you didn't complain or fuss but instead chose to make lemonade out of lemons and had a great time in Singapore. I have a feeling we'll stay connected and grow closer post MBA, I look forward to that! Wishing you all the best in this next chapter", "sender": "Nati"}, {"message": "My brother, your energy is so positive. You are always so focused but open to having a good time. I appreciate your friendship!", "sender": "Anonymous"}, {"message": "Kofi, you amazing person! You are always so great to spend time with and bring a smile, encouragement, and insightful conversation. You are really good at speaking life into people.", "sender": "Onyi"}]}, "nkeiruka-okororie": {"name": "Nkeiruka", "fullName": "Nkeiruka Okororie", "notes": [{"message": "NK I feel so blessed that God put us in a cohort together. Whenever I see you, I feel inspired to a be a little more goofy, charismatic (even snarky in the best way). I’m going to miss you when this journey is over. I was hoping we would ring things out with the Cayman Islands, but we’ll have to do it another way 💛", "sender": "Haniel Ogburu-Ogbonnaya"}, {"message": "NKKK! Truly one of the most genuine, thoughtful people I know. It's been such an honour to see you grow and glow. Grateful for our friendship always and can't wait to see you keep shining", "sender": "Tolu"}, {"message": "Let's take over Dallas! Let's keep being great!", "sender": "Anonymous"}]}, "tennessee-watt": {"name": "Tennessee", "fullName": "Tennessee Watt", "notes": [{"message": "Sis - you’re an amazing hustle, and I’m excited to see where you’ll go post-Wharton. Always here to celebrate your wins and remind you of your great achievements whenever that’s needed.", "sender": "Abigael"}]}, "lyndon-sam": {"name": "Lyndon", "fullName": "Lyndon Sam", "notes": [{"message": "Thanks for always being so supportive & encouraging!", "sender": "Kendese"}, {"message": "Lyndon! Thank you for being my lifeline during WABF especially. I truly admire your thoughtfulness, kindness, curiosity and your ability to engage on any topic at almost any time. I'll always cherish the memories from traveling with you in Thailand and Indonesia and I'm really grateful that we got to be double alums together and connected at Wharton.", "sender": "Gaelle"}]}, "rowa-el-tohami": {"name": "Rowa", "fullName": "Rowa El-tohami", "notes": [{"message": "love to see just living your life in your own terms to the fullest", "sender": "Lyncy"}, {"message": "Rowa! So grateful for your friendship and energy these last two years. Can't wait to see you keep shining", "sender": "Tolu"}, {"message": "Your intentionality to bring in Ib was great with WABF and did a great job bringing people in! You’re also very good at communicating in group settings!", "sender": "Onyi"}]}, "mueni-ithau": {"name": "Mueni", "fullName": "Mueni Ithau", "notes": [{"message": "I always love to see your vibrant energy!", "sender": "Lyncy"}, {"message": "Muen Muen! I can't believe this is coming to an end. Thank you so much for being a great roomie and friend! From the moment I spoke to you over the phone, I knew you'd make a great/fun roomie. Thanks for showing Kenya to us and letting us into your home and family. Its truly so special and one of my best Wharton mems! Love you dearly!", "sender": "NK"}, {"message": "Muen! You are truly one of the greatest gifts Wharton has given me and I'm so grateful. Thank you for being you <3", "sender": "Gaelle"}, {"message": "You’re such a diligent and encouraging person because watching you is motivating! You execute on your goals, especially bringing us all to Kenya! You invest so heavily into community and you really look out for people. You show me what it looks like to lead with a focus on people first", "sender": "Onyi"}]}, "sam-mcdaniel": {"name": "Sam", "fullName": "Sam McDaniel", "notes": [{"message": "Sam!!! Always love seeing your energy and how bring the community together!!", "sender": "Lyncy"}, {"message": "Sam, my brother. From being in the same cohort to discussing all things NFC East, what a joy it's been to get to know you over the past two years. I appreciate your tenacity and drive but also the kindness and care you show others. I also admire your vulnerability and willingness to be real about life. You're genuinely one of my favorite people in this program and I can't wait to see what you do next; I'll see you at the cap table!", "sender": "Nati"}, {"message": "From being the first person I met at Wharton to coming up on the end of this experience I have truly appreciated your friendship throughout", "sender": "Ben"}]}, "rebecca-abara-azubuike": {"name": "Rebecca", "fullName": "Rebecca Abara-Azubuike", "notes": [{"message": "Rebecca, it's been such a joy to watch the intentionality with which you've moved through the program. I'm impressed by your focus and deeply appreciate your genuine kindness and good nature. I'm wishing you all the best in everything you do and look forward to staying connected, I'll be rooting for you!!", "sender": "Nati"}, {"message": "So happy to have shared these two years with you Rebecca! One of the most genuine, thoughtful and driven people I know. Can't wait to see you keep shining!", "sender": "Tolu"}, {"message": "You are such an amazing and kind person! You have a talent for making people feel really cared for in quick interactions. You have such a regal aura and you're always on top of things and do things with such maturity, kindness, and grace including how you treat people. Thank you for doing such an amazing job with anime day as well and always being a great vibe!!", "sender": "Onyi"}, {"message": "Thank you for your thoughtfulness and consideration at all times! You are truly a great individual and I admire you!", "sender": "Anonymous"}]}, "amanda-agyapong": {"name": "Amanda", "fullName": "Amanda Agyapong", "notes": [{"message": "Amanda, it's been a joy getting to know you during the MBA. Your joy is contagious, and I always find myself laughing when we chat. The world needs more laughter and joy, so keep being you! I'm wishing you all the best and can't wait to see what you do next!", "sender": "Nati"}, {"message": "Amanda! One of the most funny and kind people I've met during my time at Wharton. Keep bringing that energy, rooting for you!", "sender": "Tolu"}, {"message": "The Dance Studio QUEEN!! You crushed it! Keep being great and an amazing person!", "sender": "Anonymous"}, {"message": "Amanda!!! You are such a grea+ person and friend. You are incredibly au+hentic, genuine, care about doing good, and principled. I am very grateful to have gotten to know you better and thank you for sharing the gift of your marketing prowess with so many of us via WABF and the quarter zips. We really would not have had the conference we did without you, thank you for so generously extending yourself and your network.", "sender": "Onyi"}]}, "adem-ahmed": {"name": "Adem", "fullName": "Adem Ahmed", "notes": [{"message": "Adem, my Habesha brother. I'm grateful to have met you during this program. I admire the focus you've shown in school and the way you've leaned into the academics here. Your contributions in class were always thoughtful and your contributions in our chats were hilarious. Look forward to staying connected man and wishing you the best!", "sender": "Nati"}, {"message": "Thanks for always picking up the phone or calling me back and letting me rant and vent! I love and appreciate you, you very level headed kind man.", "sender": "Amanda Agyapong"}, {"message": "Adem, you have great character and I enjoy our conversations.", "sender": "Anonymous"}, {"message": "My son, these will be the only encouraging words you hear from me. You are a very hard worker and your impressive gym progress is a testament to that. I’ve enjoyed getting to know you and appreciate your willingness to help people.", "sender": "Your father"}]}, "will-ahoua": {"name": "Will", "fullName": "Will Ahoua", "notes": [{"message": "Will my man, so grateful to have met you here at Wharton bro. I appreciate the convos we've had, your intelligence sharpens those around you and your enjoy means that you'll always make sure people have a good time. Brazil was a great time bro, will never forget that Flamengo game haha. Wishing you all the best in Dallas and can't wait to see the impact you have out there man. Look forward to staying connected!", "sender": "Nati"}, {"message": "You inspire me everyday to be the best version of myself! Thanks for your friendship and all the fun laughter.", "sender": "NK"}, {"message": "Grateful to have shared these two years with you my guy! More races more wins, onwards and upwards", "sender": "Tolu"}, {"message": "You are a true class act, Will! I learn a lot from observing you and appreciate your ability to bring balance to situations, go deep with people and topics, your confidence, and your overall good nature. I’m excited to grow closer!", "sender": "Onyi"}]}, "tolu-alamu": {"name": "Tolu", "fullName": "Tolu Alamu", "notes": [{"message": "Tolu, it's been a joy being in this program with you. I've enjoyed our convos and the times we've shared together at church, thanks for being a light. I'm wishing you the best in what comes next bro!", "sender": "Nati"}, {"message": "Tolu, you inspire me with your commitment and dedication! Keep going!", "sender": "Anonymous"}, {"message": "Tolu! You’re a great guy who brings a smile to my face. You are so consistent and a core part of our community.", "sender": "Onyi"}]}, "kola-alawalye": {"name": "Kola", "fullName": "Kola Alawalye", "notes": [{"message": "Kola, I've really enjoyed our time in the MBA. Indonesia was a great time and I enjoyed the thoughtful questions you would ask. You're hilarious and I found our conversations to be fun and light. I'm wishing you all the best and look forward to staying in touch in the DMV!", "sender": "Nati"}, {"message": "My Odogwu my Oga. I appreciate you so much man! Been a lit two years, always rooting for you", "sender": "Tolu"}, {"message": "Brother KOLA!! You are the man, and I love getting to know you! Let's continue to stay locked in and make some money!", "sender": "Anonymous"}, {"message": "The man with the golden reputation!! You are a principled guy, hilarious, collector of great vibes and someone I am grateful to have met. We met early during Black@Wharton 101 and little did I know the quality of person I was speaking to!", "sender": "Onyi"}]}, "illen-asmerom": {"name": "Illen", "fullName": "Illen Asmerom", "notes": [{"message": "Illen, my fellow Habesha! I've so enjoyed our time together in the program. I've appreciated your thoughtful contributions in class and also enjoyed all our times outside of class as well, Vietnam was a blast.I also really admired your thoughtfulness when Onyi got injured last year, it really meant a lot to him and was so kind of you.  I'm wishing you all the best with your next chapter and look forward to staying connected!", "sender": "Nati"}, {"message": "I love your energy and how joyous you are!", "sender": "Anonymous"}, {"message": "Illen! You are such a great vibe and have been consistently since we started Wharton. Thank you sooooo much for spearheading the flowers for me last year. You have a really caring heart and that really touched me because it was so thoughtful. You're also very creative and such a dope person!", "sender": "Onyi"}]}, "kojoh-atta": {"name": "Kojoh", "fullName": "Kojoh Atta", "notes": [{"message": "Kojinho, my brother in investments! Such a joy to get to know you the past 2 years man. I've always appreciated the depth of conversation that we have and admire the way you navigate the world so freely. I look forward to staying in touch man and can't wait to see where you end up going next!", "sender": "Nati"}, {"message": "KOJOH!!!!! My guy! I'm so grateful for our friendship. You've truly been there for me through ups and downs. We have the best memories together and I look forward to all the amazing things you are going to accomplish in the future.", "sender": "NK"}, {"message": "Afrobeats King! Keep being great, keep smiling, and keep dancing!", "sender": "Anonymous"}, {"message": "Huge shout out to you for always being so forward thinking, especially in regards to business. You are good at sharing opportunities and engaging with people and that is meaningful and will be as time progresses!", "sender": "Onyi"}]}, "nayo-ayegbajeje": {"name": "Nayo", "fullName": "Nayo Ayegbajeje", "notes": [{"message": "Nayo, my brother in backhands. Tennis was a great way for us to connect (as well as Karoake) but i've appreciated many other memories, like our time in Japan and Brazil. You're thoughtful, kind, and sharp and I appreciate the way you push my thinking. I'm wishing you all the best in SF and look forward to staying connected!", "sender": "Nati"}, {"message": "You are an inspiration bro! Keep being great!", "sender": "Anonymous"}, {"message": "The great photographer! You bring great energy and you are a really diligent person. I feel like I constantly learn when I'm around you. The time in Brazil as well as when we would shoot around both gave me points of really appreciating your intentionality and reflection.", "sender": "Onyi"}]}, "lorentez-barbour": {"name": "Lorentez", "fullName": "Lorentez Barbour", "notes": [{"message": "Tez, my guy. Our cloth talk over the past 2 years has been one of the highlights of my MBA experience. You're a born leader, kind-hearted guy, and a lot of fun to be around. I've enjoyed all our interactions and can't wait to be colleagues at McKinsey soon. I'm wishing you all the best in this next chapter and am rooting for you all the way. Look forward to staying in touch and all that's ahead bro!", "sender": "Nati"}, {"message": "Cheers to making it through AAMBAA co-presidency together - I appreciate you!", "sender": "Elyshia"}, {"message": "Been a time sharing these two years with you Mr. President. Keep winning", "sender": "Tolu"}, {"message": "Mr. President! You inspire greatness, brother! Keep raising the bar! I appreciate you and love you!", "sender": "Anonymous"}, {"message": "Tez, you really are a great guy! You have a level of peace and joy that translates into care for community and natural inclinations towards leadership that I learn from. Whenever I call you president or Obama, it's not because of the title but it's because you hold yourself in a very intentional way that makes trust natural.", "sender": "Onyi"}]}, "abigael-bamgboye": {"name": "Abigael", "fullName": "Abigael Bamgboye", "notes": [{"message": "Abigael, thank you for being such a joy to be around! You're so full of joy and radiate that to all around you. We've shared great times in Indonesia and in WCF and I admire how you lead WCF so well this year. I pray you continue to reflect God's love to all you touch and interact with, as the world is a better place for it. I'm wishing you all the best in what's ahead and can't wait to see what you do next!", "sender": "Nati"}, {"message": "It has been amazing getting to know you deeply over the last two years. Looking forward to more in-depth conversations and our successes!", "sender": "Anonymous"}, {"message": "Abigael, you are so kind! So thoughtful! So principled! I enjoy our conversations adn you are always a warm heart. Thank you for also hosting and building community so much. You make environments better.", "sender": "Onyi"}]}, "benjamin-barnett": {"name": "Benjamin", "fullName": "Benjamin Barnett", "notes": [{"message": "Ben my man, outside of you winning the fantasy football title last year (i'm coming for you this year lol), I've enjoyed all of our time together during the MBA. You're a thoughtful and kind-hearted guy, who is incredibly smart but also cares about those around you. Thanks for being such a great part of the MBA program and my personal friend group. I really appreciatd your kind words last year and always enjoy the time we spend together, whether on the couch watching basketball or on the beach in Rio playing volleyball. I can't wait to see what you do next, I'm excited for you bro!", "sender": "Nati"}, {"message": "Ben, you're a great guy, truly. I remember meeting day 1 and I am glad we sat near each other. Little did I know that I was talking to someone incredibly wise, smart, balanced, and fun. I also didn't know I was talking to the guy who you can NEVER get a suspect statement past. You catch everything.", "sender": "Onyi"}]}, "koyeawon-mendee": {"name": "Koyeawon", "fullName": "Koyeawon Mendee", "notes": [{"message": "Koy, you’re one of the most hardworking and selfless people at Wharton. Keep being exactly who you are and never change. Wharton wouldn’t be the same for any of us without you.", "sender": "Kola A"}, {"message": "KOYE! Hahaha! Jk. Your an amazing roomie and friend and I am so happy that we were able to experience this Wharton journey together. Living with your pen pal of 4 years isn't a crazy idea after all. Thanks for being so selfless and caring. I wish you many more blessings this year!", "sender": "NK"}, {"message": "Koy, you are my whole heart! I'm so lucky to have found a sister in you and I'm beyond grateful and admire your kindness, generosity, thoughtfulness, humor, and just overall brilliance! <3 Your right hand.", "sender": "Gaelle"}]}, "blessing-edem": {"name": "Blessing", "fullName": "Blessing Edem", "notes": [{"message": "Ble Ble! I'm so happy Wharton brought us together for the second time. You truly are a gem and an amazing friend. I pray God continues to bless you with all of your heart's desires.", "sender": "NK"}, {"message": "You my dear lead with such a quiet strength that I think is so beautiful. I loved working with you on WABF and dancing with you for Dance Studio. Keep staying true to who you are!", "sender": "Amanda Agyapong"}, {"message": "Blessing Blessing. Super grateful for your friendship and laughs these last two years. Can't wait to see all the great things that are next for you", "sender": "Tolu"}, {"message": "Love your energy! Keep being great!", "sender": "Anonymous"}, {"message": "You’re like a sister to me! We have trauma bonded over so many planned activities over these 9 years lol. I really appreciate the person you are as you are a pure soul. You do such a great job emotionally regulating too and thinking about others, you deserve to be highly prioritized too!! You’re also the reason WABF 32 happened!!", "sender": "Onyi"}]}, "gaelle-conille": {"name": "Gaelle", "fullName": "Gaelle Conille", "notes": [{"message": "You are just such a positive bright light and an amazing leader. Thank you for everything last semester and this semester as well.", "sender": "Anonymous"}, {"message": "It has been a pleasure to get to know you over the past year and a half - you are one of the most open-minded and kind hearted people I have met, and I am certain you are going to make a considerable positive impact in the world. I have appreciated your friendship and hope it continues/grows post-MBA", "sender": "Ben"}, {"message": "You’re a stellar person with incredible thoughts and insight. There is a lot that is awe-inspiring about how you think, interact with people, and set vision for yourself. You’re very humble and genuine. Definitely one of the dopest people that I have met here! There are only good things to say about you!", "sender": "Onyi"}]}, "kukua-tandoh": {"name": "Kukua", "fullName": "Kukua Tandoh", "notes": [{"message": "The MF Kuks!! You are just the best and truly an amazing person to be around. You are such a light and I am so grateful to do have experienced the last two years with you!", "sender": "NK"}, {"message": "You are a lovely genuine spirit and a true friend!", "sender": "Anonymous"}]}, "brannen-dickson": {"name": "Brannen", "fullName": "Brannen Dickson", "notes": [{"message": "My guy!!! Brannen! You're such an amazing friend and person to be around. You care about the people around you and I admire the passion you exude in everything you do (that matters to you at least haha). I am so grateful to have met you and I look forward to more laughter and light in our friendship!", "sender": "NK"}, {"message": "Brother, I am very grateful for you because of your heart. Your intentionality is what sets you apart. You communicate care to people and you aim to serve but also set a good example for knowing your own boundaries. I am grateful for friendship with you and you are someone I truly feel I grow with.", "sender": "Onyi"}]}, "kenton-mcneal": {"name": "Kenton", "fullName": "Kenton McNeal", "notes": [{"message": "Kenton! You are so thoughtful, smart, and kind. The conversations I've had with you have been some of my favorite. You've really made your mark at Wharton and I hope that you feel proud about the impact that you've made.", "sender": "Gaelle"}, {"message": "Kentonnnn. Man, one of the people I appreciate so much during my time at Wharton. From checking on people to curating the vibes to always being down to help. So glad we got to share this experience and can't wait to see you achieve your big dreams", "sender": "Tollu"}, {"message": "Kenton! When I think of you I think of versatility. You have such a wide range of interests and excel in all of them. I admire your willingness to try new things and ability to take on tough topics and dialogues with a wide range of people. You have a great way of making people feel seen and heard and I hope you continue leaning into that gift. I also admire the way in which you've challenged yourself here to the end both academically and otherwise; I can tell you learned and grew a lot from this experience and I look forward to seeing all you do!", "sender": "Nati"}, {"message": "You were one of the first and best people I met at Wharton - looking forward to keeping our friendship going for years to come", "sender": "Ben"}]}, "kendese-nangle": {"name": "Kendese", "fullName": "Kendese Nangle", "notes": [{"message": "Kendese! You were one of my first friends at Wharton and something I admired instantly and continue to admire to this day is your authenticity and strong sense of self. I hope you continue to bring those to every space that you are in and I know you will thrive! I'm really grateful for the many memories we've made at Wharton <3", "sender": "Gaelle"}, {"message": "Our resident Jamaican! So happy to have made a great friend in you these last 2 years. Keep on keeping it real", "sender": "Tolu"}]}, "andrew-udofa": {"name": "Andrew", "fullName": "Andrew Udofa", "notes": [{"message": "My podcast co-host! I appreciate your thoughtfulness and the many convos we've had over the last 2 years (especially the more spicy ones). Your curiosity and open-mindedness are true strengths and it's been wonderful sharing space with you.", "sender": "Gaelle"}, {"message": "Mandem! A real one frrr...truly a pleasure sharing these two years with you. Onwards and upwards", "sender": "Tolu"}, {"message": "My classmate, my friend, and most importantly, my brother, I appreciate you! You truly have made the Wharton experience a memorable one and one for the ages! Let's keep being great and take over Dallas! I love you bro!", "sender": "Anonymous"}, {"message": "Getting to know you and building our friendship has been one of the best things about Wharton - looking forward to continuing it into the next chapter", "sender": "Ben"}]}, "james-walker-iii": {"name": "James", "fullName": "James Walker III", "notes": [{"message": "James! Thank you for all the debates, the laughs, and the nuggets of wisdom that you insist on dressing up in rage-bait. No but for real, I appreciate your commitment to being an independent thinker and your ability to push almost any conversation forward. Both are really valuable and I hope you never change that! You’ve made our community better, and definitely more fun.", "sender": "Gaelle"}, {"message": "James, it's been a pleasure being able to get to know you better during this program. I respect your expertise and intellect but also admire your willigness to be open and vulnerable with the things that you're navigating. It's clear you're going to continue to accomplish great things professionally and I wish you all the joy and success personally as well. Look forward to staying in touch bro", "sender": "Nati"}, {"message": "Keep being you brother!", "sender": "Anonymous"}]}, "joshua-folarin": {"name": "Joshua", "fullName": "Joshua Folarin", "notes": [{"message": "Joshua, I'm so grateful to have met you bro. I admire the intention you move with and it's been a joy to study the Bible together, God's truly gifted you with a deep revelation of His word. I can't wait to see all God has in store for you bro!", "sender": "Nati"}, {"message": "You’re a catalyzer man. I think back to the preterm session often when we sat next to each other and you asked a critical question of why we had the venture lab session. It taught me then that you’re a deep thinker and I’ve seen that time and time again while also learning notably from you. Your commitment to faith is also something I personally reflect on as I grow", "sender": "Onyi"}]}, "daniele-anderson": {"name": "Daniele", "fullName": "Daniele Anderson", "notes": [{"message": "So happy to have shared this experience with you Daniele! One of the most authentic, thoughtful, funny and resilient people I know. Grateful to have made a lifelong friend in you, can't wait to see you keep shining!", "sender": "Tolu"}, {"message": "Keep being great!", "sender": "Anonymous"}, {"message": "You are such a special human being. You truly have a heart of gold and light up mine and other's lives. You are really talented at writing, so analytical, and someone that actually makes Wharton better. You also put me onto so many amazing shows and I really enjoy hanging out with you!!", "sender": "Onyi"}]}, "lapo-odunjo": {"name": "Lapo", "fullName": "Lapo Odunjo", "notes": [{"message": "Obama! Mannn I appreciate you so much. So grateful to have shared this wild experience with you Omokomo", "sender": "Tolu"}]}, "tyrone-scafe": {"name": "Tyrone", "fullName": "Tyrone Scafe", "notes": [{"message": "From Seattle to Philly, always a time hanging with you my guy! Grateful to have you as a friend", "sender": "Tolu"}]}, "wes-suggs": {"name": "Wes", "fullName": "Wes Suggs", "notes": [{"message": "One of the funniest but lowkey real people at Wharton. Truly appreciate sharing this experience with you my guy. Winner.", "sender": "Tolu"}]}, "ari-brathwaithe": {"name": "Ari", "fullName": "Ari Brathwaithe", "notes": [{"message": "Our unhinged Bahamian king! Keep putting that shit on", "sender": "Tolu"}, {"message": "Mr. PTSO!! You impress me with your balance: you’re extremely diligent and truly represented the Black community academically which is an incredible feat and worthy of praise, but you’re also very personable, very fashionable, chill, and a cool guy with clear views. I find these traits admirable", "sender": "Onyi"}]}, "loic-tchebetchou": {"name": "Loic", "fullName": "Loic Tchebetchou", "notes": [{"message": "Loic my brother! I so admire the way you've moved through this program. When I think of you, I think of a born leader. You are decisive, intentional, and clear. You set direction and follow it, and build followership alongside you. I've enjoyed all of our conversations and I'm so excited for your next chapter in Michigan. Look forward to staying in touch bro, I'll be rooting for you!", "sender": "Nati"}, {"message": "My brother keep being great! You have made Wharton a better place, and my experience much more fruitful and enjoyable! I love you bro! Let's keep raising the bar!", "sender": "Anonymous"}]}, "george-walker": {"name": "George", "fullName": "George Walker", "notes": [{"message": "G-Dub! What a joy it's been to spend time getting to know you bro. We've been locked in since rooming together in Japan and you've shown yourself to be a genuine friend and someone I really enjoy. Your intellect is clear but you're ability to move through life joyfully is something I appreciate even more. Can't wait to see what you do next bro and look forward to some Wizards games together in the DMV!", "sender": "Nati"}, {"message": "I've really appreciated getting to know you better this year and am always laughing whenever we hang out - looking forward to", "sender": "Ben"}]}, "lj-johnson-harris": {"name": "LJ", "fullName": "LJ Johnson-Harris", "notes": [{"message": "Keep being a beast bro! Love you!", "sender": "Anonymous"}, {"message": "You’re someone who it is a gift to get to know more. You have a very caring heart while also being a very focused person. Your focus teaches me ways to be better while also being able to learn from you. You also do a really, really good job embodying brotherhood and truly caring for others. I can see that you’re a great leader", "sender": "Onyi"}]}, "elyshia-geter": {"name": "Elyshia", "fullName": "Elyshia Geter", "notes": [{"message": "EG!!! You are literally goated! Keep being great, Madam President!", "sender": "Anonymous"}, {"message": "You’re an inspiring person! You’re so on top of things, which you already know, so I want to focus on you! You are kind, clear minded, and it always feels like you care about doing the right thing. You also make sure to find fun in moments and you care so much about community. Thank you for how you cared and showed up for our community", "sender": "Onyi"}]}, "tema-shongwe": {"name": "Tema", "fullName": "Tema Shongwe", "notes": [{"message": "Hey, my love! I truly enjoy our friendship and how we have continued to grow together over the last two years. You were one of the first people I met during MGMT6100, and I am so glad we met! You are stuck with me for life!", "sender": "Anonymous"}]}, "tosa-nehikhuere": {"name": "Tosa", "fullName": "Tosa Nehikhuere", "notes": [{"message": "Texas Tos! I've really enjoyed getting to know you over the past year and a half - I'm looking forward to watching a lot more sports games and all the other activities that youre always down for", "sender": "Ben"}]}, "wynston-bouknight": {"name": "Wynston", "fullName": "Wynston Bouknight", "notes": [{"message": "Man, more people should get to know you because you're a gem! You are a kind, excellent, balanced person who is always a highlight to spend time with. I still owe you that drink but I'm going to use this as our reason to HAVE to catch up post grad, I already can't wait for that!", "sender": "Onyi"}]}, "kennedy-boyd": {"name": "Kennedy", "fullName": "Kennedy Boyd", "notes": [{"message": "You do a really good job connecting with people, being yourself, and finding ways to laugh. I appreciate our talks about faith and you have amazing music taste!", "sender": "Onyi"}]}, "nati-bulcho": {"name": "Nati", "fullName": "Nati Bulcho", "notes": [{"message": "What a human. I will never forget how you showed up for me in my injury. God bless you, truly! You are someone I learn from constantly. You are a true caretaker and the way you show up for your family amazes me. May God return so much more to you than you have poured out and may you feel the same level of support as that which you provide.", "sender": "Onyi"}]}, "james-cobbinah": {"name": "James", "fullName": "James Cobbinah", "notes": [{"message": "You bring excellent vibes to groups and help make environments more fun. You were a true highlight for Rio and Cowboy Carter!", "sender": "Onyi"}]}, "isabella-coleman": {"name": "Isabella", "fullName": "Isabella Coleman", "notes": [{"message": "You’re so thoughtful and clear minded. Your words and views about the decade of 30 have really stuck with me and I find a lot of the things you say to be thought provoking and profound. You also have a smile that lights up rooms!", "sender": "Onyi"}]}, "allysha-davis": {"name": "Allysha", "fullName": "Allysha Davis", "notes": [{"message": "You’re so good at connecting with people! You might be one of the most well liked people at Wharton. You also do this without losing yourself. Your ability to be everywhere also impresses me!", "sender": "Onyi"}]}, "alexander-deaderick": {"name": "Alexander", "fullName": "Alexander Deaderick", "notes": [{"message": "Getting to speak with you more in this final semester has been something I’m really grateful for. I think you’re a great guy and you’re on an incredible path. I learn from speaking with you and truly find your perspectives insightful.", "sender": "Onyi"}]}, "hinda-diakite": {"name": "Hinda", "fullName": "Hinda Diakite", "notes": [{"message": "You’re a very dope person, Hinda!! You are really fair, funny, and make moments enjoyable. You’re great at communicating directly and holding people accountable while also being chill and open to new experiences.", "sender": "Onyi"}]}, "terrell-estime": {"name": "Terrell", "fullName": "Terrell Estime", "notes": [{"message": "You are a TRUE value adder and you deserve and will have so much success. You taught me so much about what real business is and partnerships and I am forever grateful to you for that. You are someone in whom I see so many amazing qualities like passion, focus, warmth, organization, and vision.", "sender": "Onyi"}]}, "john-franklin": {"name": "John", "fullName": "John Franklin", "notes": [{"message": "You’re a truly special human. First, you’re genuinely good at everything and I know you’re humble but you should know that. Second, you’re a guy that’s very easy to connect to. Your passions are relatable but you’re also very welcoming. Third, you put me on to Rick and Morty, and I can never forget that. Thank you for being who you are", "sender": "Onyi"}]}};
const FORM = 'https://docs.google.com/forms/d/e/1FAIpQLSdt1CqU0omN6QYJI-rJ7JEBV7glcNbtKDo5gP--isT3SWtl5Q/viewform?usp=pp_url&entry.877086558=';

let chosen = null, recipient = null, noteIdx = 0, tymer = null;

// ── INIT ──
function init() {
  const slug = new URLSearchParams(window.location.search).get('to') || '';
  recipient = RECIPIENTS[slug] || null;
  if (recipient) document.title = `For ${recipient.name} 🌹`;
  buildGrid();
}

// ── GRID ──
function buildGrid() {
  const grid = document.getElementById('celeb-grid');

  // Mystery + Randomize FIRST
  grid.appendChild(makeSpecial('mystery', '🤚', 'A mystery hand delivers it', '#b87fff',
    () => pickSpecial(grid.children[0], {name:'A Mystery Admirer', img:'', slug:'mystery'})));
  grid.children[0].querySelector('.sp-icon').style.animation = 'mystery-pulse 3s ease-in-out infinite';

  const rEl = makeSpecial('randomize', '🎲', 'Surprise me', '#50dcb4', () => doRandomize());
  rEl.id = 'randomize-card';
  rEl.querySelector('.sp-icon').style.animation = 'spin-dice 5s linear infinite';
  grid.appendChild(rEl);

  // Celebrity cards
  CELEBRITIES.forEach(c => {
    const card = document.createElement('div');
    card.className = 'celeb-card';
    card.dataset.name = c.name.toLowerCase();
    card.onclick = () => pick(card, c);
    const initials = c.name.split(' ').map(w=>w[0]).join('').slice(0,2);
    card.innerHTML = `<div class="card-img-wrap">
      <img src="${c.img}" alt="${c.name}" loading="lazy" referrerpolicy="no-referrer"
           onerror="this.style.display='none';this.nextSibling.style.display='flex'">
      <div class="card-fallback" style="display:none">${initials}</div>
      <div class="card-overlay"><div class="card-name">${c.name}</div></div>
    </div>
    <div class="card-check">✓</div>`;
    grid.appendChild(card);
  });
}

function makeSpecial(cls, icon, label, chkColor, onclick) {
  const el = document.createElement('div');
  el.className = `special-card ${cls}`;
  el.onclick = onclick;
  el.innerHTML = `<div class="sp-icon">${icon}</div><div class="sp-label">${label}</div>
    <div class="sp-check" style="background:${chkColor}">✓</div>`;
  return el;
}

// ── SELECT ──
function pick(card, celeb) {
  document.querySelectorAll('.celeb-card,.special-card').forEach(c => c.classList.remove('selected'));
  card.classList.add('selected');
  chosen = celeb;
  updateSelectionBar(celeb);
}

function pickSpecial(card, celeb) { pick(card, celeb); }

function updateSelectionBar(celeb) {
  const status = document.getElementById('sel-status');
  const thumb = document.getElementById('sel-thumb');
  const thumbImg = document.getElementById('sel-thumb-img');
  const thumbFb = document.getElementById('sel-thumb-fb');
  const btn = document.getElementById('continue-btn');
  status.innerHTML = `<strong>${celeb.name}</strong> is delivering your flowers`;
  status.classList.add('chosen');
  btn.classList.add('ready');
  if (celeb.img) {
    thumbImg.src = celeb.img;
    thumbImg.style.display = 'block';
    thumbFb.style.display = 'none';
    thumb.classList.add('visible');
  } else {
    thumbImg.style.display = 'none';
    thumbFb.style.display = 'flex';
    thumbFb.textContent = celeb.name.split(' ').map(w=>w[0]).join('').slice(0,2);
    thumb.classList.add('visible');
  }
}

// ── RANDOMIZE ──
function doRandomize() {
  const pool = CELEBRITIES.filter(c => c.img);
  let i = 0, total = 22;
  const rCard = document.getElementById('randomize-card');
  function tick() {
    const c = pool[Math.floor(Math.random() * pool.length)];
    chosen = c;
    updateSelectionBar(c);
    i++;
    if (i >= total) {
      document.querySelectorAll('.celeb-card,.special-card').forEach(x=>x.classList.remove('selected'));
      rCard.classList.add('selected');
      return;
    }
    setTimeout(tick, i < 10 ? 70 : i < 17 ? 140 : 300);
  }
  tick();
}

// ── FILTER ──
function filterCelebs() {
  const q = document.getElementById('search-input').value.toLowerCase().trim();
  let vis = 0;
  document.querySelectorAll('.celeb-card').forEach(c => {
    const show = !q || c.dataset.name.includes(q);
    c.style.display = show ? '' : 'none';
    if (show) vis++;
  });
  document.querySelectorAll('.special-card').forEach(c => c.style.display = q ? 'none' : '');
  document.getElementById('no-results').style.display = vis === 0 && q ? 'block' : 'none';
}

// ── TRANSITIONS ──
function go(fromId, toId, cb) {
  const from = document.getElementById(fromId);
  from.classList.add('leaving');
  from.classList.remove('active');
  setTimeout(() => {
    from.classList.remove('leaving');
    document.getElementById(toId).classList.add('active');
    if (cb) cb();
  }, 500);
}

// ── DELIVERY ──
function goToDelivery() {
  if (!chosen) return;
  go('screen-chooser', 'screen-delivery', () => {
    const halo = document.getElementById('delivery-halo');
    const bgEl = document.getElementById('delivery-bg');
    const noteBg = document.getElementById('note-bg');
    const outroBg = document.getElementById('outro-bg');

    if (chosen.img) {
      halo.innerHTML = `<img src="${chosen.img}" alt="${chosen.name}" referrerpolicy="no-referrer"
        onerror="this.style.display='none';this.nextSibling.style.display='flex'">
        <div class="halo-fallback" style="display:none">🤚</div>`;
      [bgEl, noteBg, outroBg].forEach(b => b.style.backgroundImage = `url('${chosen.img}')`);
    } else {
      halo.innerHTML = `<div class="halo-fallback">🤚</div>`;
    }

    document.getElementById('delivery-tag').textContent = `${chosen.name} is delivering your roses`;
    const name = recipient ? recipient.name : 'You';
    document.getElementById('delivery-msg').textContent =
      `${name}, you have made a notable impact on those around you. For that, take a moment to receive your flowers.`;
  });
}

// ── NOTES ──
function startNotes() {
  noteIdx = 0;
  go('screen-delivery', 'screen-note', () => setTimeout(() => showNote(0), 80));
}

function showNote(idx) {
  const notes = recipient.notes;
  const n = notes[idx];

  const progEl = document.getElementById('note-progress');
  progEl.textContent = `Note ${idx+1} of ${notes.length}`;
  progEl.className = 'note-progress' + (notes.length >= 3 ? ' prominent' : '');

  // Reset without transition flash
  const scroll = document.getElementById('note-scroll');
  const roseWrap = document.getElementById('rose-wrap');
  const ribbon = document.getElementById('ribbon-line');
  const sig = document.getElementById('note-sig');
  const body = document.getElementById('note-body');

  [scroll, roseWrap, ribbon].forEach(el => el.style.transition = 'none');
  scroll.classList.remove('open');
  roseWrap.classList.remove('bloomed');
  ribbon.classList.remove('untied');
  sig.classList.remove('show');
  body.textContent = '';
  if (tymer) clearTimeout(tymer);

  requestAnimationFrame(() => requestAnimationFrame(() => {
    [scroll, roseWrap, ribbon].forEach(el => el.style.transition = '');
    setTimeout(() => roseWrap.classList.add('bloomed'), 60);
    setTimeout(() => ribbon.classList.add('untied'), 900);
    setTimeout(() => scroll.classList.add('open'), 1500);
    setTimeout(() => typeIt(body, n.message, 22, () => {
      document.getElementById('note-sig-name').textContent = n.sender;
      sig.classList.add('show');
    }), 2200);
  }));

  // Buttons
  const actions = document.getElementById('note-actions');
  actions.innerHTML = '';
  if (idx < notes.length - 1) {
    const btn = makeBtn('Next note →', '', () => { scroll.classList.remove('open'); setTimeout(() => showNote(idx+1), 500); });
    actions.appendChild(btn);
  } else {
    actions.appendChild(makeBtn('See all notes', '', goToAllNotes));
    actions.appendChild(makeBtn('Done →', 'secondary', goToOutro));
  }
}

function makeBtn(txt, cls, fn) {
  const b = document.createElement('button');
  b.className = `note-btn ${cls}`;
  b.textContent = txt;
  b.onclick = fn;
  return b;
}

// ── TYPEWRITER ──
function typeIt(el, text, speed, cb) {
  el.innerHTML = '';
  const cur = document.createElement('span');
  cur.className = 'note-cursor';
  let i = 0;
  function tick() {
    el.textContent = text.slice(0, ++i);
    el.appendChild(cur);
    if (i < text.length) { tymer = setTimeout(tick, speed); }
    else { cur.remove(); if (cb) setTimeout(cb, 300); }
  }
  tick();
}

// ── ALL NOTES ──
function goToAllNotes() {
  const from = document.getElementById('screen-note').classList.contains('active') ? 'screen-note' : 'screen-delivery';
  go(from, 'screen-allnotes', () => {
    document.getElementById('all-notes-list').innerHTML = recipient.notes.map(n => `
      <div class="note-item">
        <div class="note-item-msg">"${n.message}"</div>
        <div class="note-item-sig">— <span>${n.sender}</span></div>
      </div>`).join('');
  });
}

// ── OUTRO ──
function goToOutro() {
  const from = document.getElementById('screen-note').classList.contains('active') ? 'screen-note' : 'screen-allnotes';
  go(from, 'screen-outro', () => {
    const halo = document.getElementById('outro-halo');
    if (chosen && chosen.img) {
      halo.innerHTML = `<img src="${chosen.img}" referrerpolicy="no-referrer" alt="${chosen.name}"
        onerror="this.style.display='none';this.nextSibling.style.display='flex'">
        <div class="outro-fallback" style="display:none">🤚</div>`;
    } else {
      halo.innerHTML = `<div class="outro-fallback">🤚</div>`;
    }
    if (recipient) {
      document.getElementById('rose-btn').onclick = () =>
        window.open(FORM + encodeURIComponent(recipient.fullName), '_blank');
    }
  });
}

document.addEventListener('DOMContentLoaded', init);
</script>
